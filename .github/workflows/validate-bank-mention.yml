name: Validate bank notification registry
on:
  pull_request:
    paths:
      - 'server.js'
      - 'tools/apply-compact-rich-menu.mjs'
      - 'tools/journal-external-browser-url.mjs'
      - 'tools/test-journal-external-browser-url.mjs'
      - 'assets/line/work-journal-uof-rich-menu-external-browser-half-height.*'
      - 'versions/AM-IMP-2026.1007.01/**'
      - 'core/operational-memory.js'
      - 'core/bank-line-reply-intake.js'
      - 'core/leaf-calendar/**'
      - 'tools/test-leaf-calendar.mjs'
      - 'tools/install-leaf-calendar.mjs'
      - 'tools/enroll-leaf-calendar.mjs'
      - 'versions/AM-IMP-2026.1006.07/**'
      - 'core/line-io/**'
      - 'core/line.js'
      - 'core/router.js'
      - 'tools/test-line-io*.mjs'
      - 'tools/test-line-directory.mjs'
      - 'tools/test-line-bindings.mjs'
      - 'tools/test-line-capture-latency.mjs'
      - 'tools/install-line-bindings.mjs'
      - 'tools/check-upgrade-package.js'
      - 'versions/AM-IMP-2026.0929.04/**'
      - 'versions/AM-IMP-2026.0929.05/**'
      - 'versions/AM-IMP-2026.0929.01/**'
      - 'versions/AM-IMP-2026.0929.02/**'
      - 'versions/AM-IMP-2026.0929.03/**'
      - 'versions/AM-IMP-2026.1003.03/**'
      - 'versions/AM-IMP-2026.1004.02/**'
      - 'versions/AM-IMP-2026.1006.01/**'
      - 'versions/AM-IMP-2026.1006.03/**'
      - 'modules/operational-memory/**'
      - 'modules/collect/**'
      - 'core/direct-line.js'
      - 'modules/personal-assistant/**'
      - 'tools/dryrun-personal-line-routing.mjs'
      - 'tools/verify-private-assistant-pause.mjs'
      - 'versions/AM-IMP-2026.1006.02/**'
      - 'core/notion.js'
      - 'modules/meetings/**'
      - 'versions/AM-IMP-2026.1004.06/**'
      - 'versions/AM-IMP-2026.1004.07/**'
      - 'core/attachment-retrieval.js'
      - 'tools/test-attachment-retrieval.mjs'
      - 'core/attachment-archive.js'
      - 'core/drive.js'
      - 'core/bootstrap.js'
      - 'tenants/*.json'
      - 'tools/attachment-retention.mjs'
      - 'tools/test-attachment-retention.mjs'
      - 'versions/AM-IMP-2026.1004.04/**'
      - 'tools/verify-bank-line-reply-intake.mjs'
      - 'versions/AM-IMP-2026.0928.01/**'
      - 'core/claims-authority.js'
      - 'core/claims-authority-admin.js'
      - 'tools/test-claims-form-availability.mjs'
      - 'versions/AM-IMP-2026.1004.01/**'
      - 'versions/AM-IMP-2026.1004.03/**'
      - 'tools/test-mobile-claim-form.mjs'
      - 'modules/claims/**'
      - 'modules/company-line-push/**'
      - 'tools/dryrun-claims-*.mjs'
      - 'tools/verify-company-line-push.mjs'
      - 'tools/dryrun-processing-jobs-store.mjs'
      - 'versions/AM-IMP-2026.0918.01/**'
      - '.github/workflows/validate-bank-mention.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test tools/test-journal-external-browser-url.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1007.01
      - run: node --test tools/test-attachment-retrieval.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.07
      - run: node --test tools/test-attachment-retention.mjs
      - run: node --experimental-vm-modules tools/verify-attachment-webhook.mjs
      - run: node tools/dryrun-collect-attachment-archive.mjs
      - run: node tools/dryrun-core.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.06
      - run: node tools/dryrun-personal-line-routing.mjs
      - run: node --experimental-vm-modules --test tools/test-leaf-calendar.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1006.07
      - run: node --experimental-vm-modules tools/verify-private-assistant-pause.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1006.02
      - run: node tools/dryrun-meetings.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.04
      - run: npm run dryrun:claims-authority
      - run: node --test tools/test-claims-form-availability.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.01
      - run: node --test tools/test-mobile-claim-form.mjs
      - run: node --test tools/test-line-staff-entry.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.05
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.03
      - run: npm run verify:bank-mention
      - run: npm run dryrun:processing-jobs
      - run: node --experimental-vm-modules tools/verify-bank-line-reply-intake.mjs
      - run: node --test tools/test-line-io.mjs
      - run: node --test tools/test-line-io-card-appearance.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1004.02
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1006.01
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1006.03
      - run: node --test tools/test-line-directory.mjs
      - run: node --test tools/test-line-bindings.mjs
      - run: node --test tools/test-line-capture-latency.mjs
      - run: node tools/check-upgrade-package.js AM-IMP-2026.1003.03
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0929.04
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0929.05
      - run: node tools/test-line-io-sql.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0929.01
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0929.02
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0929.03
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0928.01
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0918.01
      - run: node tools/check-upgrade-package.js AM-IMP-2026.0918.02
